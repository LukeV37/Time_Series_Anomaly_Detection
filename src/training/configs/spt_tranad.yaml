# Minimal SPT TranAD training config.
# Expects preprocessing output with precomputed train/val/test splits.

input:
  npz_path: /lcrc/project/AIDQ/users/lvaughan/run/spt/default/processed.npz

loader:
  batch_size: 32
  num_workers: 0

model:
  type: tranad
  params:
    window_size: 10
    d_model: 128
    nhead: 8
    num_layers: 2
    dim_feedforward: 256
    dropout: 0.1

training:
  epochs: 50
  learning_rate: 1.0e-4
  device: null

output:
  checkpoint_path: null
  test_errors_path: /lcrc/project/AIDQ/users/lvaughan/run/spt/default/test_errors.npy
