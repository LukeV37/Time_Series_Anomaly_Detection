# Minimal SPT TranAD training config for the no-trim preprocessing workflow.
# Splits a single preprocessing artifact chronologically by timestep.
#
# Relative input paths are resolved under:
#   input.root or $OUTPUT_DIR, then input.experiment, then input.data_tag.
# Relative output paths are resolved under:
#   output.root or input.root or $OUTPUT_DIR, then input.experiment, then
#   output.data_tag if set, otherwise input.data_tag.
#
# Keep input.experiment and input.data_tag aligned with the preprocessing YAML
# so training reads the matching train/test .npz artifacts.
# Output artifacts always use input.experiment; output.data_tag defaults to
# input.data_tag when omitted or null.
#
# Example with OUTPUT_DIR=/lcrc/project/AIDQ/users/lvaughan/run/:
#   train_npz_path: train_processed.npz -> /lcrc/project/AIDQ/users/lvaughan/run/spt/no_trim/train_processed.npz
#   test_errors_path: test_errors.npy -> /lcrc/project/AIDQ/users/lvaughan/run/spt/no_trim/test_errors.npy

input:
  root: null
  experiment: spt
  data_tag: no_trim
  train_npz_path: train_processed.npz
  test_npz_path: test_processed.npz

split:
  train_ratio: 0.6
  val_ratio: 0.2

loader:
  batch_size: 256
  num_workers: 0

model:
  type: tranad
  params:
    window_size: 10
    d_model: 1024
    nhead: 8
    num_layers: 2
    dim_feedforward: 256
    dropout: 0.1

training:
  scaling: robust  # Fit per-channel median/IQR on the chronological training split.
  epochs: 100
  learning_rate: 1.0e-4
  final_learning_rate: 1.0e-6
  optimizer: AdamW
  weight_decay: 1.0e-5
  max_grad_norm: 1.0
  device: null

output:
  root: null
  data_tag: null
  checkpoint_path: null
  test_errors_path: test_errors.npy
  loss_curve_path: loss_curve.png
