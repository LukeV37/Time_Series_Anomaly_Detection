# GM2 preprocessing pipeline
# Mirrors the preprocessing policy defined in configs/data_config/gm2.yml.
#
# Steps are applied in order to a (T, C, D) NumPy array.
# Each step references a function exposed through preprocessing.registry.STEP_MAP.

pipeline:
  steps:
    # 1. Drop features not needed for GM2 (keep freq and amp; drop length and power).
    #    Indices 2 and 3 correspond to [freq=0, amp=1, length=2, power=3].
    - type: transform
      function: drop_features
      params:
        indices: [2, 3]

    # 2. Remove known bad edges for specific runs when a run number is provided.
    - type: filter
      function: trim_edges
      params:
        remove_first: 0
        remove_last: 0
        run_specific:
          "351325":
            remove_last: 50
          "351364":
            remove_last: 150

    # 3. Replace any residual NaN values with zero before scaling.
    - type: transform
      function: fill_nan
      params:
        value: 0.0

    # 4. Clip scaled values to a per-feature symmetric range.
    #    freq has heavier tails so gets a tighter bound than power.
    #    (These are post-scaling clip bounds; adjust if scaling changes.)
    - type: normalizer
      function: clip_values
      params:
        low: -8.0
        high: 8.0
