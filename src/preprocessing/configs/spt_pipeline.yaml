# Shared SPT preprocessing defaults.
#
# Loader defaults to $SPT_DATA_DIR_BENCHMARK. Output roots default to $OUTPUT_DIR.

loader:
  type: spt
  params:
    train_years: [2019, 2020, 2021]
    test_years: [2022, 2023]
    data_variant: snr
    response_template: calibrator_responses_095ghz_{year}.hdf5
    snr_template: calibrator_response_snrs_095ghz_{year}.hdf5
    observation_id_key: Observation ID
    require_monotonic_timestamps: true
    load_response_reference: true
    feature_names:
      response: response
      snr: SNR

steps:
  - name: interpolate_nan_per_channel

    #- name: select_stable_channels
    #params:
    #low_quantile: 20.0
    #high_quantile: 80.0
    #tolerance: 0.05
    #reference_metadata_key: quality_reference_response

    #- name: filter_quality_timesteps
    #params:
    #require_positive: true
    #low_quantile: 1.0
    #high_quantile: 100.0
    #min_valid_fraction: 0.99

output:
  save: true
  root: null
  # root: ./output
  experiment: spt
  data_tag: no_trim
  file_name: train_processed.npz
