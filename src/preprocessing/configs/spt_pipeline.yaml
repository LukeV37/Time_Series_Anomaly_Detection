# Preprocessing pipeline config.
#
# Loader roots default to the matching environment variable when set.
# Output roots default to $OUTPUT_DIR when set.

loader:
  type: spt
  params:
    root: null
    # root: ./output
    years: [2019]

steps:
  - name: drop_nan_channels
    params:
      threshold: 0.1

  - name: drop_nan_timesteps
    params:
      threshold: 0.005

  - name: fill_nan
    params:
      value: 0.0

  - name: clip_values
    params:
      low: -5.0
      high: 5.0

output:
  save: true
  root: null
  # root: ./output
  experiment: spt
  data_tag: default
  file_name: processed.npz
