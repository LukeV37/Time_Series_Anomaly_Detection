# Preprocessing pipeline config.
#
# Loader roots default to the matching environment variable when set.
# Output roots default to $OUTPUT_DIR when set.

loader:
  type: spt
  params:
    root: null
    # root: ./output
    years: [2019]
    label_variant: snr

steps:
  - name: drop_nan_channels
    params:
      threshold: 0.1

  - name: drop_nan_timesteps
    params:
      threshold: 0.005

  - name: save_labels
    params:
      source_feature: 0
      key: snr_raw

  - name: split
    params:
      train_ratio: 0.6
      val_ratio: 0.2

  - name: robust_scale
    params:
      clip_low: null
      clip_high: null

output:
  save: true
  root: null
  # root: ./output
  experiment: spt
  data_tag: default
  file_name: processed.npz
