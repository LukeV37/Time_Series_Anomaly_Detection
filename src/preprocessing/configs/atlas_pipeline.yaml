# ATLAS preprocessing pipeline
#
# The loader returns a (T, C, D) NumPy array plus metadata.
# Steps are applied in order to the array.
# For merged ATLAS CSV input, D=2 corresponds to [value, deltaT].

loader:
  type: atlas
  params:
    root: null
    run_number: null

pipeline:
  steps:
    - name: drop_nan_channels
      params:
        threshold: 0.02

    - name: fill_channel_median

    - name: clip_values
      params:
        low: 0.0
        high: 100.0

output:
  save: true
  root: null
  experiment: atlas
  data_tag: merged_csv
  file_name: processed.npz
