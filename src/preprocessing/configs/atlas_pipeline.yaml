# Preprocessing pipeline config.
#
# Loader roots default to the matching environment variable when set.
# Output roots default to $OUTPUT_DIR when set.

loader:
  type: atlas
  params:
    root: null
    # root: ./output
    run_number: null

steps:
  - name: drop_nan_channels
    params:
      threshold: 0.02

  - name: fill_channel_median

  - name: clip_values
    params:
      low: 0.0
      high: 100.0

output:
  save: true
  root: null
  # root: ./output
  experiment: atlas
  data_tag: merged_csv
  file_name: processed.npz
